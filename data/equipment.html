
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EDS 설비 현황</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f7fb;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 14px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #17365d;
      color: white;
    }
  </style>
</head>
<body>

<h1>EDS 설비 현황</h1>
<p>GitHub에 저장된 설비 자료입니다.</p>

<table>
  <thead>
    <tr>
      <th>설비명</th>
      <th>수량</th>
      <th>전력(kW/대)</th>
    </tr>
  </thead>
  <tbody id="equipment-list"></tbody>
</table>

<p id="message"></p>

<script>
fetch("./data/equipment.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("자료를 찾을 수 없습니다.");
    }
    return response.json();
  })
  .then(data => {
    const list = document.getElementById("equipment-list");

    data.forEach(item => {
      const row = document.createElement("tr");

      [item.name, item.quantity, item.powerKW].forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });

      list.appendChild(row);
    });
  })
  .catch(error => {
    document.getElementById("message").textContent =
      "자료 불러오기 실패: " + error.message;
  });
</script>

</body>
</html>
